<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#164b41" />
    <title>Toetscijfers · Cijfertabel</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">✓</span> Toetscijfers</div>
    </header>
    <main>
      <h1>Cijfertabel</h1>
      <p class="intro">Stel je normering in en lees het cijfer af bij de behaalde punten.</p>
      <div class="layout">
        <aside>
          <section class="settings" aria-labelledby="settings-title">
            <h2 id="settings-title">Normering</h2>
            <label for="maximum">Maximum aantal punten</label>
            <div class="field">
              <input id="maximum" type="number" value="50" min="0.5" step="0.5" required />
              <span>punten</span>
            </div>
            <label for="norm">Percentage voor een 6,0</label>
            <div class="field">
              <input
                id="norm"
                type="number"
                value="70"
                min="0.01"
                max="99.99"
                step="0.01"
                required
              />
              <span>%</span>
            </div>
            <p id="error" role="alert"></p>
            <div id="summary" role="status"></div>
          </section>
          <section class="chart-panel" aria-labelledby="chart-heading">
            <h2 id="chart-heading">Normeringsgrafiek</h2>
            <button
              type="button"
              class="chart-toggle"
              aria-expanded="false"
              aria-controls="grade-chart"
            >
              Toon grafiek
            </button>
            <svg
              id="grade-chart"
              viewBox="0 0 300 242"
              aria-hidden="true"
              role="img"
              aria-labelledby="chart-description"
            >
              <title id="chart-description"></title>
              <text x="6" y="15">Cijfer</text>
              <path
                class="chart-grid"
                d="M30 30H280 M30 64H280 M30 98H280 M30 132H280 M30 166H280 M30 183H280 M30 191.5H280 M30 200H280"
              />
              <g class="chart-ticks" text-anchor="end" dominant-baseline="middle">
                <text x="24" y="30">10</text>
                <text x="24" y="64">8</text>
                <text x="24" y="98">6</text>
                <text x="24" y="132">4</text>
                <text x="24" y="166">2</text>
                <text x="24" y="180">1</text>
                <text x="24" y="191.5">0,5</text>
                <text x="24" y="204">0</text>
              </g>
              <g>
                <text x="30" y="222">0%</text>
                <text x="155" y="222" text-anchor="middle">50%</text>
                <text x="280" y="222" text-anchor="end">100%</text>
                <text x="155" y="240" text-anchor="middle">Percentage</text>
              </g>
              <polyline class="chart-line" />
              <circle class="chart-norm" cy="98" r="3" />
              <text class="chart-label"></text>
            </svg>
          </section>
        </aside>
        <section class="results" aria-labelledby="result-title">
          <div class="table-title">
            <h2 id="result-title" tabindex="-1">Punten en cijfers</h2>
            <span id="count"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th scope="col">Punten</th>
                <th scope="col">Percentage</th>
                <th scope="col">Cijfer</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <nav aria-label="Tabelpagina’s" hidden>
            <button id="prev">Vorige</button>
            <span id="range"></span>
            <button id="next">Volgende</button>
          </nav>
        </section>
      </div>
    </main>
  </body>
</html>
