<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#164b41" />
    <title>Toetscijfers · Cijfertabel</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:url" content="https://toetscijfers.nl/" />
    <meta property="og:title" content="Toetscijfers · Cijfertabel" />
    <meta
      property="og:description"
      content="Stel je normering in en lees per half punt het bijbehorende toetscijfer af."
    />
    <meta property="og:image" content="https://toetscijfers.nl/toetscijfers-deelkaart.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Toetscijfers naast een groen potlood en ruitjespapier met een 8,5 en een vinkje."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">✓</span> Toetscijfers</div>
    </header>
    <main>
      <h1>Cijfertabel</h1>
      <p class="intro">Stel je normering in en lees het cijfer af bij de behaalde punten.</p>
      <div class="layout">
        <aside>
          <section class="settings" aria-labelledby="settings-title">
            <h2 id="settings-title">Normering</h2>
            <label for="maximum">Maximum aantal punten</label>
            <div class="field">
              <input id="maximum" type="number" value="50" min="0.5" step="0.5" required />
              <span>punten</span>
            </div>
            <label for="norm">Percentage voor een 6,0</label>
            <div class="field">
              <input
                id="norm"
                type="number"
                value="70"
                min="0.01"
                max="99.99"
                step="0.01"
                required
              />
              <span>%</span>
            </div>
            <p id="error" role="alert"></p>
            <div id="summary" role="status"></div>
          </section>
          <section class="chart-panel" aria-labelledby="chart-heading">
            <h2 id="chart-heading">Normeringsgrafiek</h2>
            <button
              type="button"
              class="chart-toggle"
              aria-expanded="false"
              aria-controls="grade-chart"
            >
              Toon grafiek
            </button>
            <svg
              id="grade-chart"
              viewBox="0 16 300 312"
              aria-hidden="true"
              role="img"
              aria-labelledby="chart-description"
            >
              <title id="chart-description"></title>
              <path
                class="chart-grid"
                d="M30 30H280 M30 57H280 M30 84H280 M30 111H280 M30 138H280 M30 165H280 M30 192H280 M30 219H280 M30 246H280 M30 273H280 M30 300H280"
              />
              <g class="chart-ticks" text-anchor="end" dominant-baseline="middle">
                <text x="24" y="30">10</text>
                <text x="24" y="57">9</text>
                <text x="24" y="84">8</text>
                <text x="24" y="111">7</text>
                <text x="24" y="138">6</text>
                <text x="24" y="165">5</text>
                <text x="24" y="192">4</text>
                <text x="24" y="219">3</text>
                <text x="24" y="246">2</text>
                <text x="24" y="273">1</text>
                <text x="24" y="300">0</text>
              </g>
              <g>
                <text x="30" y="322">0%</text>
                <text x="155" y="322" text-anchor="middle">50%</text>
                <text x="280" y="322" text-anchor="end">100%</text>
              </g>
              <polyline class="chart-line" />
              <g id="chart-norm" class="chart-marker">
                <circle r="3" />
                <text></text>
              </g>
              <g id="chart-minimum" class="chart-marker">
                <circle r="3" />
                <text></text>
              </g>
            </svg>
          </section>
        </aside>
        <section class="results" aria-labelledby="result-title">
          <div class="table-title">
            <h2 id="result-title" tabindex="-1">Punten en cijfers</h2>
            <span id="count"></span>
          </div>
          <table>
            <thead>
              <tr>
                <th scope="col">Punten</th>
                <th scope="col">Fouten</th>
                <th scope="col">Cijfer</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <nav aria-label="Tabelpagina’s" hidden>
            <button id="prev">Vorige</button>
            <span id="range"></span>
            <button id="next">Volgende</button>
          </nav>
        </section>
      </div>
    </main>
  </body>
</html>
